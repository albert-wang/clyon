[package]
name = "clyon"
version = "0.2.0"
authors = ["Albert <albertywang@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "clyon"
crate_type = ["staticlib"]

[dependencies]
lyon = "1.0.19"

# A panic can't unwind into the C++ caller, so abort the process instead.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
